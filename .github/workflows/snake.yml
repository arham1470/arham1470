name: Generate Contribution Snake

on:
  schedule:
    # Run automatically every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: arham1470
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300FF41&color_dots=%230D1117,%23003300,%23006600,%2300CC00,%2300FF41
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300FF41

      - name: Deploy snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
